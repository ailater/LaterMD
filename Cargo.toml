[workspace]
resolver = "2"
members = [
  "vendor/egui_markdown",
  "vendor/egui_markdown/egui_markdown_style",
  "crates/latermd-ai",
  "crates/latermd-app",
  "crates/latermd-bed",
  "crates/latermd-creds",
  "crates/latermd-editor",
  "crates/latermd-export",
  "crates/latermd-git",
  "crates/latermd-md",
  "crates/latermd-mcp",
  "crates/latermd-render",
  "crates/latermd-search",
]

[workspace.package]
# 与发布 tag 对齐(dist 校验 tag 与包版本一致);v0.0.1 起合入 main 自动递增 patch
version = "0.0.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/ailater/LaterMd"

[profile.release]
# 默认即可;后续按 M0 帧率数据再调 opt-level/lto

# cargo-dist 构建专用 profile(dist 默认;资产用 thin LTO 减体积)
[profile.dist]
inherits = "release"
lto = "thin"
