[package]
name = "latermd-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LaterMD desktop application (the only GUI crate)"
repository.workspace = true
# 应用图标嵌入 Windows exe 资源段(#74)。用target 条件而非普通
# build-dependencies:winresource 调的是 Windows 资源编译器,别的平台
# 既用不上也不该编进依赖树。build.rs 本体也用 `#[cfg(windows)]` 圈死。
# 详见 build.rs 顶部注释(为什么与 eframe 的运行时窗口图标是两件事)。
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# 发布二进制名统一 latermd(crate 名不动,资产名由 dist.toml shadow 对齐);
# 显式声明 [[bin]] 会关闭该 target 的路径自动发现,故必须写 path
[[bin]]
name = "latermd"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
# 图片渲染(docs/image-plan.md B 段):vendored 层把 Token::Image 画成
# egui::Image 的分支在该 feature 之后(上游自带,未改 vendor 一行);
# http 随之开启,ehttp 的原生后端就是依赖树里已有的 ureq,不是第二套 HTTP 栈
egui_extras = { version = "0.36.2", default-features = false, features = [
    "file",
    "image",
] }
# 图片解码格式开到 D 段白名单口径(PNG/JPEG/WebP/GIF);egui_extras 只透传
# png,其余格式由这里直接开(image 已在依赖树:eframe 截图用)
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
# 默认开 syntax_highlighting:P0 代码块高亮(ADR-004 清单内);images =
# 预览出图(B 段),上游 feature,未改 vendor
egui_markdown = { path = "../../vendor/egui_markdown", features = ["images"] }
# 剪贴板图片读取(D 段):egui 0.36 内建剪贴板只出不进(get_text 有、
# get_image 无),Ctrl+V 的图片字节直接用 arboard 取。3.6.1 已在依赖树
# (eframe → egui-winit/clipboard → arboard/image-data),此处把传递依赖
# 提升为直接依赖,零新增编译面;登记见 ADR-004
arboard = "3.6"
# 检查更新(#71 M2):关于窗 GET GitHub releases/latest。3.4.2(rustls)
# 已在依赖树(latermd-ai/latermd-bed 直依赖,ehttp 亦同版本),此处照
# arboard 先例把传递依赖提升为直接依赖,零新增编译面
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# 主题:开启 vendor 子 crate 自带的 serde feature(MarkdownStyle 派生,ThemeSettings 持久化)
egui_markdown_style = { path = "../../vendor/egui_markdown/egui_markdown_style", features = ["serde"] }
# 主题设置(ThemeSettings/ThemeMode)的序列化 derive
serde = { version = "1", features = ["derive"] }
# 主题持久化(settings.json)与文件树状态(file_tree.json)落盘 JSON;ADR-004 已登记
serde_json = "1"
latermd-editor = { path = "../latermd-editor" }
# 大纲条目(OutlineItem)与标题提取的快路径
latermd-md = { path = "../latermd-md" }
# AI 流式 provider(MockProvider 联调,P1「AI 流式写作」);workspace 内部
# crate 依赖,不属 ADR-004 外部依赖清单
latermd-ai = { path = "../latermd-ai" }
# AI API key 的系统凭据存取(P2「凭据管理」):设置浮窗保存/清除 + AI 命令
# key 闸门的优先后端;同 workspace 内部 crate,不属 ADR-004 外部依赖清单
latermd-creds = { path = "../latermd-creds" }
# 图床配置与上传(docs/image-plan.md C 段):设置「图片」页与图片框的
# 上传链路;纯配置+契约 crate,不依赖 egui(铁律 2)
latermd-bed = { path = "../latermd-bed" }
# HTML 导出(ADR-004 清单内,P0 验收项)
latermd-export = { path = "../latermd-export" }
# Git 只读集成(P2 版本层):状态角标、Git 面板与确认式单文件回滚
latermd-git = { path = "../latermd-git" }
# 文档库检索核心(P1 搜索已下沉至此,docs/mcp-plan.md §3 方案 A):侧边栏
# 只留状态机,MCP 的 search_docs/list_files 复用同一实现
latermd-search = { path = "../latermd-search" }
# mermaid flowchart 解析+布局绘制指令(#51;铁律 2:纯 Rust 不依赖 egui,
# app 侧翻译为 painter 调用;workspace 内部 crate,非 crates.io 新依赖)
latermd-render = { path = "../latermd-render" }
# 本地 MCP server(docs/mcp-plan.md):进程内后台线程暴露五个只读工具,
# 让外部 AI 检索本机文档库
latermd-mcp = { path = "../latermd-mcp" }
# 同步文件对话框(ADR-004 清单);Linux 默认走 xdg-portal,不依赖 GTK 开发库
rfd = "0.17.2"
# 文件树目录遍历(ADR-004 清单;遵循 .gitignore,ADR-005 §4.1)
ignore = "0.4.33"
# ai:// 链接协议的 prompt 百分号解码(ADR-004 清单,decisions-pending #11):
# 只用严格 %XX 解码,+ 不当空格
percent-encoding = "2.3.2"
dark-light = "3.0.0"
ron = "0.12.2"
trash = "5.2.9"

[dev-dependencies]
# M0 主验证 2「长文档性能」的自建基准(headless 单帧渲染耗时)。
# 版本与 vendor 的 bench 一致,已在本仓 Cargo.lock 中。
criterion = "0.5.1"

[[bench]]
name = "longdoc"
harness = false

[features]
# 逃生后端:默认产物只带 wgpu(AGENTS.md §5)。开启本 feature 的构建才能响应
# LATERMD_RENDERER=glow;CI 用 `--features glow` 编一条额外产线验证可编译。
glow = ["eframe/glow"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSEvent", "NSCell", "NSPasteboard", "NSWindow", "NSView", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSProcessInfo", "NSString", "NSObject"] }
