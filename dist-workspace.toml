# cargo-dist 发布配置(docs/roadmap.md「打包」条目;AGENTS.md §5 三平台矩阵)
# release.yml 由 `dist generate` 生成,但带有三处 LOCAL PATCH(见 docs/distribution.md §1:
# workflow_dispatch 入口 / actions:write / host 尾部 dispatch macos-dmg)——
# dist 运行时会校验 release.yml 与模板逐字节一致,补丁必然触发
# "has out of date contents" 硬错误(2026-09-26 v0.0.1 首发实测踩中),
# 故必须 allow-dirty。将来 `dist generate` 重生成后,补丁须按 distribution.md 清单重打。
# macOS universal2 dmg 走自建 custom job,不经本文件的 installer 通道。

[workspace]
members = ["cargo:."]

[dist]
# release.yml 带 LOCAL PATCH,关闭 CI 模板一致性校验(0.33 的 allow-dirty 是类别列表,理由见文件头注释)
allow-dirty = ["ci"]
# CI 内安装的 dist 版本钉死(生成的 release.yml 里 dist installer URL 由此读取)
cargo-dist-version = "0.33.0"
# CI 后端与发布渠道:GitHub Release(AGENTS.md §5 分发策略)
ci = "github"
hosting = "github"
# 不产 shell/powershell/homebrew installer:GUI 桌面应用用不上脚本安装器;
# macOS 走自建 cask(crazykun/homebrew-ailater,universal2 dmg + postflight 去 quarantine),
# dist 自带的 homebrew installer 产 formula(引 tar.xz)而非 cask,故关闭。
installers = []
# 三平台四目标矩阵:Linux x64 / macOS 双架构(由 merge-tasks 合并到
# macos-14 单 job,见下)/ Windows x64。Win ARM64 不再出包(2026-10-12
# 坤哥:资产面收敛,ARM64 机器经 Windows 的 x64 模拟运行 x64 包);
# 源码级测试矩阵(rust.yml)仍保留 aarch64-pc-windows-msvc。
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# macOS 双架构合并到 macos-14(ARM runner)单 job 交叉编 x86_64:
# ①universal2 dmg 的 lipo 前置(同一 job 内产出两架构二进制);
# ②摆脱 macos-15-intel runner 退场风险(roadmap 风险登记册)。
# dist 0.33 无 universal2-apple-darwin target(上游 config/v1/mod.rs 标 FIXME),
# dmg 合成由后续模块的自建 custom job 完成。
merge-tasks = true

# (曾有的 Win ARM64 自定义 runner 段随目标移除一并退役:2026-09-26 起
# windows-11-arm 原生 runner 曾绕开 ring 0.17 的 cargo-xwin 容器编不过问题。)

[dist.github-custom-runners.x86_64-apple-darwin]
runner = "macos-14"
