# 代码镜像：任何分支/标签的推送都把本仓库原样镜像到 CNB
# （cnb.cool/ailater/LaterMd）。CNB 侧的 Release 产物同步见根目录 .cnb.yml。
#
# 需要 GitHub 仓库 secret：CNB_TOKEN（cnb.cool 的访问令牌）。
name: Mirror to CNB

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror push to CNB
        env:
          CNB_USER: cnb
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -e
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git push --mirror "https://${CNB_USER}:${CNB_TOKEN}@cnb.cool/ailater/LaterMd.git"
