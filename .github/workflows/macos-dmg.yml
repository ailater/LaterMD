# macOS universal2 dmg —— cargo-dist 不产 dmg,且 0.33 无 universal2 target
# (上游 config/v1/mod.rs 标 FIXME),故自建本 job。
#
# 时序:dist 的 release.yml 构建各架构 tar.xz 并创建 Release 后,由其 host job
# 尾部 `gh workflow run macos-dmg.yml -f tag=<tag>` 显式 dispatch 本 workflow
# (release.yml 用 GITHUB_TOKEN 建 Release,该事件不会触发 on: release ——
# GitHub 防递归规则,workflow_dispatch 是唯一例外通道,详见 docs/distribution.md §1)。
# on: release 保留给人工/PAT 场景(手动在 GitHub 页面发 Release 仍可触发)。
# 本 job 下载两个架构的二进制 → lipo 合一 → 打成 .app bundle → 合成 dmg →
# 回传同一 Release → 尾部回填 tap cask(cask-bump 步,失败仅告警,见其注释)。
#
# 为什么要 .app 而不是裸二进制:macOS 的 GUI 应用必须走 bundle 才能正常获得
# 窗口焦点与输入法上下文(直接跑命令行二进制会丢 IME 候选框跟随),这是
# M0 头号风险项(IME)的前置条件,不是可选项。
#
# 产出资产名:latermd-v{version}-universal2-apple-darwin.dmg
# 与 homebrew-ailater tap 的 cask URL 模板对应(复刻 lscreen 模式)。

name: macOS dmg

on:
  release:
    types: [published]
  # 常规通道:release.yml host job dispatch(tag 入参)
  workflow_dispatch:
    inputs:
      tag:
        description: "要合成 dmg 的版本 tag(如 v0.0.1)"
        required: true

permissions:
  contents: write

# 同一 tag 若被 release 事件与 dispatch 双触发,只跑一个
concurrency:
  group: macos-dmg-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  universal-dmg:
    runs-on: macos-14
    steps:
      # Info.plist 是仓库文件(packaging/macos/Info.plist),必须 checkout
      # (dispatch 走 main,release 事件走 tag 对应提交,两者内容一致)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: 取版本号
        id: ver
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # dmg 二进制改自建(2026-10-24,#163):dist 的 tar.xz 是纯 wgpu 默认
      # features 产物,而 mac dmg 要带 glow 逃生口(LATERMD_RENDERER=glow,
      # 绕开问题 GPU 驱动的唯一手段——AGENTS.md §5 修订)。给 dist 全局开
      # glow 会连 Windows/Linux 产物一起变,故 mac 专属的自建通道最贴身。
      - name: Rust 工具链(钉 1.98.0,AGENTS.md §4;含交叉 x86_64)
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: macos-dmg-glow

      - name: 构建双架构二进制(带 glow 逃生口)
        run: |
          set -euo pipefail
          cargo build --release --locked -p latermd-app --bin latermd \
            --features glow \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: lipo 合一
        run: |
          set -euo pipefail
          lipo -create \
            -output latermd-universal \
            target/x86_64-apple-darwin/release/latermd \
            target/aarch64-apple-darwin/release/latermd
          # 两个架构都在,缺一个说明构建矩阵漏了目标
          lipo -archs latermd-universal | tee /dev/stderr | grep -q x86_64
          lipo -archs latermd-universal | tee /dev/stderr | grep -q arm64

      # 磁盘腾挪(2026-10-25,v0.0.11 首跑踩坑):lipo 完成后二进制已抽到
      # 仓库根,两份 target 目录(合计 >10GB)只剩缓存价值;macos runner
      # 可用磁盘 ~14GB,不清就轮到 hdiutil 报 No space left on device。
      # 代价:rust-cache 的 post 步存不到 target,下次发版全量重建
      # (~11min)—— 发布频次(天级)下可接受,磁盘爆是每次必挂。
      - name: 清理构建产物腾磁盘
        run: |
          rm -rf target/x86_64-apple-darwin target/aarch64-apple-darwin
          df -h /

      - name: 组装 .app bundle
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 与本地开发包共用 plist、图标与签名验证，失败时阻止发布坏包。
          bash packaging/macos/bundle.sh latermd-universal LaterMD.app "$VERSION"

      - name: 合成 dmg
        id: dmg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          DMG="latermd-v${VERSION}-universal2-apple-darwin.dmg"
          # 不用 `hdiutil create -srcfolder` 的一步式:它按源目录**估算**
          # 镜像容量,codesign 的 xattr/资源叉不计入 —— v0.0.11 两次实跑都
          # 在拷贝段炸 `No space left on device`(df 明明有 38Gi 可用,
          # 见 2026-10-25 run 40151400200 / 40153872774)。改为显式分步:
          # 固定大小空镜像 → 挂载 → ditto 拷入 → 卸载 → convert 压缩,
          # 每一步可独立归因。
          df -h /System/Volumes/Data || true
          du -sh LaterMD.app || true
          hdiutil create -size 512m -fs "HFS+" -volname "LaterMD" \
            -attach -ov "${RUNNER_TEMP}/latermd-staging.dmg"
          ditto LaterMD.app "/Volumes/LaterMD/LaterMD.app"
          hdiutil detach "/Volumes/LaterMD"
          hdiutil convert "${RUNNER_TEMP}/latermd-staging.dmg" \
            -format UDZO -o "$DMG"
          echo "file=$DMG" >> "$GITHUB_OUTPUT"
          SHA=$(shasum -a 256 "$DMG" | cut -d ' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### macOS universal2 dmg"
            echo ""
            echo "- 文件: \`$DMG\`"
            echo "- sha256: \`$SHA\`"
            echo ""
            echo "cask 回填(尾部 cask-bump 步)用该 version + sha256 更新"
            echo "crazykun/homebrew-ailater 的 Casks/latermd.rb,失败仅告警。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 回传 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" \
            "${{ steps.dmg.outputs.file }}" --clobber \
            --repo "${{ github.repository }}"

      # 清理发布冗余资产:macOS 分发只走 universal2 dmg(AGENTS.md §5),
      # 每架构 tar.xz 对 mac 用户是冗余(dmg 二进制已改本 job 自建带 glow,
      # tar.xz 不再是 dmg 原料,但也没有独立分发渠道);dist 的 source.tar.gz
      # 与 GitHub 自动生成的 source 归档重复。dist 无产物白名单配置,只能
      # 发布后清理。
      # 放在本 job 尾部(dmg 已回传)才不会与其它消费步竞态;
      # 每个资产容忍缺失(只 echo 不标红),命名漂移靠 docs/distribution.md 表 2 核对。
      # 已知代价:sha256.sum 是 dist 生成的全量清单,仍含已删条目,接受。
      - name: 清理冗余资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for A in \
            latermd-aarch64-apple-darwin.tar.xz \
            latermd-aarch64-apple-darwin.tar.xz.sha256 \
            latermd-x86_64-apple-darwin.tar.xz \
            latermd-x86_64-apple-darwin.tar.xz.sha256 \
            source.tar.gz \
            source.tar.gz.sha256; do
            gh release delete-asset "${{ steps.ver.outputs.tag }}" "$A" \
              --repo "${{ github.repository }}" --yes \
              || echo "skip $A(不存在)"
          done

      # 回填 Homebrew cask(#22,可选增强):把本次 version + dmg sha256 写回
      # crazykun/homebrew-ailater 的 Casks/latermd.rb,把 cask 跟版延迟从 tap 侧
      # auto-bump cron(每小时 :23)的最长 1 小时压到发版即时。
      # 放「清理冗余资产」之后:本步只消费 ver/dmg 两个 step output,不碰任何
      # Release 资产,与清理步零交互;放尾部让核心发布链(回传+清理)先跑完,
      # 本步再慢再错也不拖累主链。与 tap cron 双写同一文件但值同源同值(同一
      # dmg 的 sha256:本地 shasum == GitHub asset digest),contents API 带
      # blob sha 原子覆盖,撞车最坏是 PUT 409 → 落到下面告警分支、由 cron 兜底,
      # 无害(取舍登记 docs/decisions-pending.md #57)。
      # 失败语义选「脚本内逐命令兜底 + 显式 exit 0」而非 continue-on-error:
      # true——后者仍会在 UI 给 step 挂红叉,且分不出失败原因;前者按无 token /
      # gh api 失败 / 行格式不匹配三类各自 ::warning:: 并写 step summary,
      # 末尾 trap EXIT 强制 exit 0:step 恒绿,job 恒成功,发布链不受影响。
      # HOMEBREW_TAP_TOKEN 是对 tap 仓库 contents:write 的 PAT(需人工配到本仓
      # secrets;GITHUB_TOKEN 跨仓库无写权限);未配置走跳过分支,是人工项,
      # 不算失败。GitHub 侧生效验证留人工(blocked_external)。
      - name: 回填 Homebrew cask
        id: cask-bump
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          DMG_SHA256: ${{ steps.dmg.outputs.sha256 }}
          TAP_REPO: crazykun/homebrew-ailater
          CASK_PATH: Casks/latermd.rb
        run: |
          set -uo pipefail
          # 本步灵魂:任何路径都不许把 job 搞红——显式兜底之外再挂 EXIT 网
          trap 'exit 0' EXIT

          warn() {
            echo "::warning::$1"
            echo "- ⚠️ cask 回填:$1" >> "$GITHUB_STEP_SUMMARY"
          }

          # 无 token = 人工项,不算失败;tap 侧 auto-bump cron 仍会跟版
          if [ -z "${GH_TOKEN}" ]; then
            warn "未配置 HOMEBREW_TAP_TOKEN,cask 回填跳过(人工项;tap 侧 auto-bump cron 仍会自动跟版,人工回填步骤见 docs/distribution.md §3.4)"
            exit 0
          fi

          # 1) 读 cask 现状:tap 默认分支 HEAD 的 blob sha + base64 内容。
          #    不钉 ref/branch( PUT 同理省略 branch 字段,均取默认分支):
          #    tap 仓只有一个分支且叫 master,任务书写的 ?ref=main 实测 404
          #    (2026-09-30 gh api 验证),以现状为准;默认分支改名也无需跟改。
          RESP="$(gh api "repos/${TAP_REPO}/contents/${CASK_PATH}")" || {
            warn "读取 ${TAP_REPO}/${CASK_PATH} 失败(gh api 出错/网络不可达),cask 回填跳过"
            exit 0
          }
          printf '%s' "${RESP}" > "${RUNNER_TEMP}/cask.json"

          # 2) 解码并替换 version / sha256 两行(各恰好命中一行,否则告警跳过)
          PYERR="${RUNNER_TEMP}/cask-bump.err"
          if ! python3 - "${VERSION}" "${DMG_SHA256}" "${RUNNER_TEMP}" <<'PY' 2> "${PYERR}"
          import base64, json, re, sys

          def die(msg):
              sys.exit("cask 回填中止:" + msg)

          version, dmg_sha, tmp = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              with open(f"{tmp}/cask.json") as fh:
                  doc = json.load(fh)
              text = base64.b64decode(doc["content"]).decode("utf-8")
          except Exception as exc:
              die(f"cask 内容读取/解码失败:{exc.__class__.__name__}: {exc}")

          pat_ver = re.compile(r'^( +version +")([^"]*)("$)', re.M)
          pat_sha = re.compile(r'^( +sha256 +")([^"]*)("$)', re.M)
          for name, pat in (("version", pat_ver), ("sha256", pat_sha)):
              n = len(pat.findall(text))
              if n != 1:
                  die(f"{name} 行命中 {n} 次(应为 1),cask 行格式与预期不符")

          new = pat_ver.sub(lambda m: m.group(1) + version + m.group(3), text)
          new = pat_sha.sub(lambda m: m.group(1) + dmg_sha + m.group(3), new)
          with open(f"{tmp}/cask-payload.json", "w") as fh:
              json.dump(
                  {
                      "message": f"latermd {version}: bump cask version and sha256",
                      "content": base64.b64encode(new.encode("utf-8")).decode("ascii"),
                      "sha": doc["sha"],
                  },
                  fh,
              )
          PY
          then
            warn "$(cat "${PYERR}")"
            exit 0
          fi

          # 3) 回写:commit message 带版本,便于 tap 仓审计
          NEW_SHA="$(gh api --method PUT "repos/${TAP_REPO}/contents/${CASK_PATH}" \
            -H "Content-Type: application/json" \
            --input "${RUNNER_TEMP}/cask-payload.json" --jq .commit.sha)" || {
            warn "回写 ${TAP_REPO}/${CASK_PATH} 失败(gh api 4xx:并发撞车/权限不足/网络),cask 回填跳过"
            exit 0
          }
          echo "cask 已回填:${TAP_REPO}/${CASK_PATH} → version ${VERSION},commit ${NEW_SHA}"
          echo "- ✅ cask 回填:${TAP_REPO}/${CASK_PATH} 已跟版至 ${VERSION},sha256 取本次 dmg(tap 侧 commit ${NEW_SHA})" >> "$GITHUB_STEP_SUMMARY"
