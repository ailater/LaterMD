# CNB 云原生构建配置
#
# 背景：本仓库通过 .github/workflows/mirror-to-cnb.yml 在推送分支/标签时
#      `git push --mirror` 到 cnb.cool/ailater/LaterMd，本文件随代码同步到
#      CNB 后自动生效（CNB 侧无需任何额外配置）。
#
# 策略：CNB 不本地构建任何平台，统一镜像 GitHub Release 产物。
#   - Windows/macOS 在 CNB 的 Linux 容器本就无法构建（Apple SDK / MSVC）；
#   - Linux 若在 CNB 另行构建，与 GitHub 产物位元不一致，两边等于两个版本；
#   - 同一次 tag 推送并行触发 GitHub Actions release.yml 出包，本流水线
#     等其全部完成后原样镜像——两边下载到同一批文件、同一份校验和。
#
# 与 LaterScreen 的两处差异（本仓库发版链路更长的必然结果）：
#   1. 完成判定不能只等 sha256.sum。dist host 建好 Release 后，裸 exe /
#      macOS dmg / Linux deb / Inno Setup 安装器由三个独立 job 异步补传
#      （release.yml 的 LOCAL PATCH），必须等五项关键资产全部到齐。
#   2. 首次镜像会一次推入全部历史 tag。早于 GitHub 最新发布的 tag 在
#      「历史版本检查」直接退出（exit 0，流水线绿色），不空轮询报红；
#      只有最新发布及其后的新 tag 才出包。prerelease 场景当前未使用。
#
# 校验口径：dist 生成的 sha256.sum 只列 dist 自己的产物，其中 Apple
# tar.xz 切片与 source.tar.gz 实际并不随 Release 发布（macOS 只出
# universal2 dmg）——这些条目跳过，资产里存在的逐条核对。
#
# 流程（单流水线串行）：
#   1. 历史版本检查：tag 版本号早于 GitHub 最新发布则直接结束
#   2. 轮询 GitHub Release 直到五项关键资产到齐，下载全部资产，
#      发布说明直接取 GitHub 正文（dist 生成的 Release Notes + 下载表）
#   3. git:release 创建 CNB Release（标题与 GitHub 一致，即 tag 名）
#   4. cnbcool/attachments 统一上传为 CNB Release 附件
#
# 说明：
#   - $ 为兜底键，tag_push 挂在 $ 下表示对所有 tag 生效
#   - tag_push 事件下 CNB_BRANCH 即被推送的 tag 名，无需手工传参
#   - 轮询上限约 80 分钟：本仓库在 dist 主构建之外还有 dmg/deb 两个
#     独立工作流接力（各含 runner 排队），比 LaterScreen 的 60 分钟更长；
#     GitHub 侧失败则本流水线一并失败（可见），不会发布缺包的附件
#   - 可选：在 CNB 仓库配置环境变量 GITHUB_TOKEN（个人访问令牌，只读
#     public_repo 权限即可），轮询 GitHub API 可避开未认证 60 次/小时
#     限流（CNB 共享出口 IP 常触发）；不配置也能跑
$:
  tag_push:
    - name: 镜像 GitHub Release 全平台产物
      docker:
        image: alpine:3
      stages:
        - name: 历史版本检查
          script: |
            set -e
            sed -i 's#dl-cdn.alpinelinux.org#mirrors.cloud.tencent.com#g' /etc/apk/repositories
            apk add --no-cache curl jq >/dev/null
            gh_curl() {
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                curl -H "Authorization: Bearer ${GITHUB_TOKEN}" "$@"
              else
                curl "$@"
              fi
            }
            latest=$(gh_curl --retry 3 --retry-all-errors --connect-timeout 20 -fsSL \
              "https://api.github.com/repos/ailater/LaterMd/releases/latest" | jq -r '.tag_name // ""')
            # busybox sort 无 -V，awk 逐段数值比较：CNB_BRANCH 严格小于
            # latest 才跳过（等于/大于继续）。仅支持 vX.Y.Z 数字段，
            # 与本项目 tag 约定一致
            verlt() {
              a=${1#v}; b=${2#v}
              awk -va="$a" -vb="$b" 'BEGIN{
                split(a,A,"."); split(b,B,".")
                for (i=1; i<=3; i++) {
                  x=A[i]+0; y=B[i]+0
                  if (x < y) exit 0
                  if (x > y) exit 1
                }
                exit 1
              }'
            }
            if [ -n "${latest}" ] && verlt "${CNB_BRANCH}" "${latest}"; then
              echo "跳过：${CNB_BRANCH} 早于最新发布 ${latest}，历史版本不在 CNB 出包"
              exit 0
            fi
            echo "${CNB_BRANCH} 为最新发布（或尚无发布的新 tag），继续镜像"

        - name: 等待并下载 GitHub Release 产物
          script: |
            set -e
            TAG="${CNB_BRANCH}"
            API="https://api.github.com/repos/ailater/LaterMd/releases/tags/${TAG}"
            gh_curl() {
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                curl -H "Authorization: Bearer ${GITHUB_TOKEN}" "$@"
              else
                curl "$@"
              fi
            }

            # 完成判定 = 五项关键资产到齐：sha256.sum / 裸 exe / dmg /
            # Inno Setup 安装器 / deb。前三类之外的两个是异步补传 job 的
            # 产物，缺任何一项都说明还有 job 在跑
            mkdir -p dist
            try=0
            max=64   # 64 次 × 75s ≈ 80 分钟
            while :; do
              try=$((try + 1))
              if gh_curl --retry 2 --retry-all-errors --connect-timeout 20 -fsSL "$API" -o /tmp/rel.json; then
                jq -r '.assets[].name' /tmp/rel.json > /tmp/names.txt || true
                total=$(wc -l < /tmp/names.txt)
                ok=1
                for pat in '^sha256\.sum$' '^latermd\.exe$' '\.dmg$' '-setup\.exe$' '\.deb$'; do
                  grep -qE "${pat}" /tmp/names.txt || { ok=0; break; }
                done
                if [ "${ok}" = "1" ]; then
                  echo "[第 ${try} 次] GitHub Release 全部资产已就绪（${total} 个）"
                  break
                fi
                echo "[第 ${try}/${max} 次] GitHub Actions 仍在构建（当前 ${total} 个资产，等待 dmg/deb/setup.exe/裸 exe 补传）"
              else
                echo "[第 ${try}/${max} 次] GitHub API 暂不可达或 Release 尚未创建，继续等待"
              fi
              if [ "${try}" -ge "${max}" ]; then
                echo "错误：等待约 80 分钟后 GitHub 产物仍未就绪，放弃镜像" >&2
                exit 1
              fi
              sleep 75
            done

            # 发布说明取 GitHub 正文（dist 生成的 Release Notes + 下载表），两边一致
            jq -r '.body // "此版本未提供发布说明，详见提交历史。"' /tmp/rel.json > .cnb-release-notes.md

            # 大文件从国内下载可能较慢，心跳防止无输出超时
            ( while sleep 90; do echo "[heartbeat] $(date +%H:%M:%S) 下载进行中"; done ) &
            HB=$!
            trap 'kill $HB 2>/dev/null || true' EXIT
            jq -r '.assets[].browser_download_url' /tmp/rel.json > /tmp/urls.txt
            while read -r url; do
              name=$(basename "$url")
              echo "下载 ${name}"
              gh_curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
                -o "dist/${name}" "$url"
            done < /tmp/urls.txt

            # sha256.sum 条目若不在本次资产里（Apple tar.xz 切片被
            # universal2 dmg 替代、source.tar.gz 不随 Release 发布）则跳过；
            # 其余逐条核对，缺包/损坏在此拦截
            cd dist
            fail=0
            while read -r sum file; do
              file=${file#\*}
              if [ -f "${file}" ]; then
                echo "${sum} *${file}" | sha256sum -c - || fail=1
              else
                echo "跳过校验：${file} 不在本次 Release 资产中（dist 计划产物已被后置流程替代）"
              fi
            done < sha256.sum
            if [ "${fail}" != "0" ]; then
              echo "错误：sha256 校验未全部通过" >&2
              exit 1
            fi
            cd ..
            echo "镜像就绪："
            ls -lh dist/

        - name: 发布 CNB Release
          type: git:release
          options:
            title: ${CNB_BRANCH}
            descriptionFromFile: .cnb-release-notes.md
            latest: true

        - name: 上传附件
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - dist/*
